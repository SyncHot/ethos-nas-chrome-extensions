<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EthOS NAS Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <div class="brand">
      <img src="../icons/icon32.png" alt="" width="24" height="24">
      <div class="brand-text">
        <strong>EthOS NAS</strong>
        <span id="status" class="pill">checking…</span>
      </div>
    </div>
    <button id="open-options" class="icon-btn" type="button" title="Settings">⚙</button>
  </header>

  <div id="setup" class="banner hidden">
    <p>Connect the extension to your NAS to start sending downloads.</p>
    <button id="setup-btn" class="primary" type="button">Open setup</button>
  </div>

  <nav class="tabs">
    <button class="tab active" type="button" data-tab="add">Add link</button>
    <button class="tab" type="button" data-tab="links">Page links <span id="links-count" class="badge hidden">0</span></button>
  </nav>

  <section id="panel-add" class="panel">
    <label class="field">
      <span>URL</span>
      <input id="url" type="text" placeholder="https://…, magnet:?… or a .torrent URL" autocomplete="off" spellcheck="false">
    </label>
    <div id="kind" class="kind">Paste a link from any page</div>
    <div id="clipboard-note" class="kind-note hidden">Filled from the clipboard</div>

    <details class="advanced">
      <summary>Destination</summary>
      <div class="field">
        <span>Category</span>
        <div class="field-row">
          <select id="category" aria-label="Category"></select>
          <button id="refresh-categories" class="icon-btn" type="button"
                  title="Refresh categories from the Download Manager"
                  aria-label="Refresh categories">↻</button>
        </div>
        <p id="category-note" class="hint"></p>
      </div>
      <label class="field">
        <span>Folder</span>
        <input id="folder" type="text" placeholder="NAS default download folder" autocomplete="off" spellcheck="false">
      </label>
    </details>

    <button id="send" class="primary wide" type="button">Send to NAS</button>
    <div id="result" class="result hidden" role="status"></div>

    <div class="recent">
      <div class="recent-head">
        <span>Recent</span>
        <button id="clear-history" class="link-btn" type="button">Clear</button>
      </div>
      <ul id="history" class="history"></ul>
    </div>
  </section>

  <section id="panel-links" class="panel hidden">
    <div class="links-toolbar">
      <button id="scan" class="ghost" type="button">Rescan</button>
      <label class="check"><input id="show-all" type="checkbox"> Show all links</label>
    </div>
    <ul id="link-list" class="link-list"></ul>
    <div id="links-empty" class="empty hidden">No links found on this page.</div>
    <button id="send-links" class="primary wide" type="button" disabled>Send selected</button>
  </section>

  <footer class="foot">
    <span id="footer-note">Not configured</span>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
