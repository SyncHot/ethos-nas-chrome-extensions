name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static extension guard
        run: python3 tests/test_extension.py

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the distributable zip
        run: python3 package.py
      - uses: actions/upload-artifact@v4
        with:
          name: ethos-nas-downloader
          path: dist/*.zip
